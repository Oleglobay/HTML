					color:purple;

			<h2 class="h2">Цитатник</h2>
			<p class="p1">Бальзак: «Зізнавшись у своїй слабкості, людина стає сильнішою»</p>
			<p class="p2">Леонардо Да Вінчі: «Супротивник, який показує ваші помилки, набагато корисніший, ніж друг, що приховує їх»</p>
			<p class="p3">Чарльз Діккенс: «Ніколи не говори ніколи»</p>
